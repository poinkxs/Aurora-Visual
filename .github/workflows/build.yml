              private static void renderFireflies(GuiGraphicsExtractor g, int sw, int sh) {
                  while (FIREFLIES.size() < 18) FIREFLIES.add(new Firefly(sw, sh));
                  for (Firefly f : FIREFLIES) {
                      f.x += f.vx; f.y += f.vy; f.phase += 0.05f;
                      if (f.x < 0) f.x = sw; if (f.x > sw) f.x = 0;
                      if (f.y < 0) f.y = sh; if (f.y > sh) f.y = 0;
                      int pulse = (int) ((Math.sin(f.phase) + 1.0) * 65.0) + 25;
                      int color = AuroraConfig.getAnimatedColor(f.colorOffset);
                      int ix = (int) f.x, iy = (int) f.y;
                      g.fill(ix - 2, iy - 2, ix + 2, iy + 2, AuroraConfig.withAlpha(color, pulse / 3));
                      g.fill(ix - 1, iy - 1, ix + 1, iy + 1, AuroraConfig.withAlpha(color, pulse));
                  }
              }
              private static void renderNeoVignette(GuiGraphicsExtractor g, Minecraft mc, int sw, int sh) {
                  float hp = mc.player.getHealth();
                  int borderColor = 0, alpha = 0;
                  if (hp <= 7.0f) {
                      double pulse = (Math.sin(System.currentTimeMillis() * 0.01) + 1.0) * 0.5;
                      alpha = (int) (35 + pulse * 65); borderColor = 0xFFFF0A54;
                  } else if (hitFlashAlpha > 0.01f) {
                      alpha = (int) (hitFlashAlpha * 180); borderColor = AuroraConfig.getPrimaryColor(); hitFlashAlpha *= 0.88f;
                  }
                  if (alpha > 4) {
                      int col = AuroraConfig.withAlpha(borderColor, alpha);
                      g.fill(0, 0, sw, 3, col); g.fill(0, sh - 3, sw, sh, col);
                      g.fill(0, 3, 3, sh - 3, col); g.fill(sw - 3, 3, sw, sh - 3, col);
                  }
              }
              private static void renderWatermark(GuiGraphicsExtractor g, Font font) {
                  Minecraft mc = Minecraft.getInstance();
                  String text = "AURORA 26.1 ULTIMATE  |  " + mc.getFps() + " FPS  |  [0] MENU";
                  int width = font.width(text) + 14;
                  drawNeonPanel(g, 8, 8, width, 18);
                  g.text(font, text, 15, 13, 0xFFFFFFFF, true);
