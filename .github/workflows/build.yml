              private static void drawKeyBox(GuiGraphicsExtractor g, Font font, String label, int x, int y, int w, int h, boolean pressed) {
                  int accent = AuroraConfig.getAnimatedColor(x * 15);
                  g.fill(x, y, x + w, y + h, pressed ? AuroraConfig.withAlpha(accent, 165) : 0x8810121A);
                  g.fill(x, y, x + w, y + 1, accent);
                  g.text(font, label, x + (w - font.width(label)) / 2, y + (h - 8) / 2, pressed ? 0xFF10121A : 0xFFFFFFFF, !pressed);
              }
              private static void renderPotionHud(GuiGraphicsExtractor g, Font font, Minecraft mc, int sw) {
                  Collection<MobEffectInstance> effects = mc.player.getActiveEffects();
                  if (effects.isEmpty()) return;
                  int y = 8;
                  for (MobEffectInstance eff : effects) {
                      String name = eff.getEffect().value().getDisplayName().getString();
                      int amp = eff.getAmplifier() + 1;
                      int sec = Math.max(0, eff.getDuration() / 20);
                      String label = name + (amp > 1 ? " " + amp : "") + String.format(Locale.ROOT, " (%d:%02d)", sec / 60, sec % 60);
                      int w = font.width(label) + 12;
                      int x = sw - w - 8;
                      drawNeonPanel(g, x, y, w, 16);
                      g.text(font, label, x + 6, y + 4, 0xFFFFFFFF, true);
                      y += 20;
                  }
              }
              private static void renderTargetHud(GuiGraphicsExtractor g, Font font, int sw, int sh) {
                  if (currentTarget == null) return;
                  float hp = currentTarget.getHealth();
                  float maxHp = Math.max(1f, currentTarget.getMaxHealth());
                  animatedHealth += (hp - animatedHealth) * 0.18f;
                  float ratio = Math.max(0f, Math.min(1f, animatedHealth / maxHp));
                  int boxW = 142, boxH = 44, x = sw / 2 + 18, y = sh / 2 + 12;
                  drawNeonPanel(g, x, y, boxW, boxH);
                  String name = currentTarget.getName().getString();
                  if (name.length() > 16) name = name.substring(0, 16) + "...";
                  Minecraft mc = Minecraft.getInstance();
                  float dist = mc.player != null ? mc.player.distanceTo(currentTarget) : 0f;
                  boolean winning = mc.player != null && mc.player.getHealth() >= hp;
                  String status = winning ? "WIN" : "RISK";
                  g.text(font, name, x + 8, y + 6, 0xFFFFFFFF, true);
                  g.text(font, String.format(Locale.ROOT, "%.1f HP | %.1fm", hp, dist), x + 8, y + 17, 0xFFB8C0FF, true);
                  g.text(font, status, x + boxW - font.width(status) - 7, y + 6, winning ? 0xFF00F5D4 : 0xFFFF0A54, true);
                  int barX = x + 8, barY = y + 31, barW = boxW - 16, barH = 6;
                  g.fill(barX, barY, barX + barW, barY + barH, 0xAA090A10);
                  g.fillGradient(barX, barY, barX + (int) (barW * ratio), barY + barH, AuroraConfig.getPrimaryColor(), AuroraConfig.getSecondaryColor());
              }
              private static void renderShockwaveAndFloatingText(GuiGraphicsExtractor g, Font font, int cx, int cy) {
                  if (shockwaveProgress < 1.0f) {
                      shockwaveProgress += 0.06f;
                      int radius = (int) (4 + shockwaveProgress * 28);
                      int col = AuroraConfig.withAlpha(AuroraConfig.getAnimatedColor(0), (int) ((1.0f - shockwaveProgress) * 190));
                      g.fill(cx - radius, cy - radius, cx + radius, cy - radius + 1, col);
                      g.fill(cx - radius, cy + radius - 1, cx + radius, cy + radius, col);
                      g.fill(cx - radius, cy - radius, cx - radius + 1, cy + radius, col);
                      g.fill(cx + radius - 1, cy - radius, cx + radius, cy + radius, col);
                  }
                  Iterator<FloatingText> it = FLOATING_TEXTS.iterator();
                  while (it.hasNext()) {
                      FloatingText ft = it.next();
                      ft.y -= 0.55f; ft.alpha -= 0.025f;
                      if (ft.alpha <= 0.05f) { it.remove(); continue; }
                      g.text(font, ft.text, (int) ft.x, (int) ft.y, AuroraConfig.withAlpha(ft.color, (int) (ft.alpha * 255)), true);
                  }
              }
              private static void renderSmartCrosshair(GuiGraphicsExtractor g, Minecraft mc, int cx, int cy) {
                  float cooldown = mc.player.getAttackStrengthScale(0.0f);
                  int gap = (int) (3 + (1.0f - cooldown) * 5), len = 4, c = AuroraConfig.getAnimatedColor(0);
                  g.fill(cx - 1, cy - gap - len, cx + 1, cy - gap, c);
                  g.fill(cx - 1, cy + gap, cx + 1, cy + gap + len, c);
                  g.fill(cx - gap - len, cy - 1, cx - gap, cy + 1, c);
                  g.fill(cx + gap, cy - 1, cx + gap + len, cy + 1, c);
                  g.fill(cx - 1, cy - 1, cx + 1, cy + 1, cooldown >= 0.99f ? 0xFF00F5D4 : 0xFFFFFFFF);
              }
              private static void renderSparks(GuiGraphicsExtractor g) {
                  Iterator<Spark> it = SPARKS.iterator();
                  while (it.hasNext()) {
                      Spark s = it.next();
                      s.x += s.vx; s.y += s.vy; s.vy += 0.06f; s.alpha -= 0.035f;
                      if (s.alpha <= 0f) { it.remove(); continue; }
                      int ix = (int) s.x, iy = (int) s.y;
                      g.fill(ix - 3, iy - 3, ix + 3, iy + 3, AuroraConfig.withAlpha(s.color, (int) (s.alpha * 85)));
                      g.fill(ix - 1, iy - 1, ix + 2, iy + 2, AuroraConfig.withAlpha(s.color, (int) (s.alpha * 255)));
                  }
              }
              public static void drawNeonPanel(GuiGraphicsExtractor g, int x, int y, int w, int h) {
                  int c1 = AuroraConfig.getAnimatedColor(0), c2 = AuroraConfig.getAnimatedColor(600);
                  g.fill(x - 2, y - 2, x + w + 2, y + h + 2, AuroraConfig.withAlpha(c1, 28));
                  g.fill(x - 1, y - 1, x + w + 1, y + h + 1, AuroraConfig.withAlpha(c2, 55));
                  g.fill(x, y, x + w, y + h, 0xCC0D0F18);
                  g.fillGradient(x, y, x + w, y + 2, c1, c2);
              }
          }
