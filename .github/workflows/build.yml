                  if (AuroraConfig.ambientFireflies) renderFireflies(graphics, sw, sh);
                  if (AuroraConfig.screenVignette) renderNeoVignette(graphics, mc, sw, sh);
                  if (AuroraConfig.watermark) renderWatermark(graphics, font);
                  if (AuroraConfig.statsPills) renderStatsPills(graphics, font, mc, sh);
                  if (AuroraConfig.keystrokes) renderKeystrokes(graphics, font, mc);
                  if (AuroraConfig.potionHud) renderPotionHud(graphics, font, mc, sw);
                  if (AuroraConfig.targetHud) renderTargetHud(graphics, font, sw, sh);
                  if (AuroraConfig.shockwaveAndCombo) renderShockwaveAndFloatingText(graphics, font, sw / 2, sh / 2);
                  if (AuroraConfig.customCrosshair) renderSmartCrosshair(graphics, mc, sw / 2, sh / 2);
                  if (AuroraConfig.hitParticles && !SPARKS.isEmpty()) renderSparks(graphics);
