                  int cy = mc.getWindow().getGuiScaledHeight() / 2;
                  if (AuroraConfig.shockwaveAndCombo && FLOATING_TEXTS.size() < 12) {
                      FLOATING_TEXTS.add(new FloatingText("COMBO x" + comboCount + "!", cx - 28, cy - 18, AuroraConfig.getPrimaryColor()));
                      FLOATING_TEXTS.add(new FloatingText(String.format(Locale.ROOT, "-%.1f HP", dmg), cx + 18, cy - 8, 0xFFFF0A54));
                  }
                  if (AuroraConfig.hitParticles && SPARKS.size() < 60) {
                      for (int i = 0; i < 14; i++) {
                          double angle = RANDOM.nextDouble() * Math.PI * 2.0;
                          float speed = 1.3f + RANDOM.nextFloat() * 3.4f;
                          int c = (i % 2 == 0) ? AuroraConfig.getPrimaryColor() : AuroraConfig.getSecondaryColor();
                          SPARKS.add(new Spark(cx, cy, (float) Math.cos(angle) * speed, (float) Math.sin(angle) * speed, c));
