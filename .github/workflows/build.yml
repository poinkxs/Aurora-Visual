              private static class Firefly {
                  float x, y, vx, vy, phase; int colorOffset;
                  Firefly(int sw, int sh) {
                      this.x = RANDOM.nextInt(Math.max(100, sw)); this.y = RANDOM.nextInt(Math.max(100, sh));
