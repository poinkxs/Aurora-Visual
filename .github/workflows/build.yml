name: Build Aurora Visuals 26.1
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'
      - name: Build Mod
        run: |
          mkdir -p mod/src/main/resources mod/src/main/java/dev/aurora/mixin
          cd mod
          printf "org.gradle.jvmargs=-Xmx3G\nminecraft_version=26.1\nloader_version=0.18.4\nloom_version=1.15-SNAPSHOT\nmod_version=2.0.0\nmaven_group=dev.aurora\narchives_base_name=aurora-visuals-mc26.1\n" > gradle.properties
          printf "pluginManagement { repositories { maven { url = 'https://maven.fabricmc.net/' }; mavenCentral(); gradlePluginPortal() } }\n" > settings.gradle
          printf "plugins { id 'net.fabricmc.fabric-loom' version \"\${loom_version}\" }\nversion = project.mod_version\ngroup = project.maven_group\nbase { archivesName = project.archives_base_name }\ndependencies { minecraft \"com.mojang:minecraft:\${project.minecraft_version}\"; implementation \"net.fabricmc:fabric-loader:\${project.loader_version}\" }\ntasks.withType(JavaCompile).configureEach { it.options.release = 25; it.options.encoding = 'UTF-8' }\n" > build.gradle
          printf '{"schemaVersion":1,"id":"auroravisuals","version":"2.0.0","name":"Aurora Visuals 26.1 Ultimate","description":"Neon Visuals for Minecraft 26.1 (PC & Pojav). Press 0 for Menu.","authors":["AuroraDev"],"environment":"client","mixins":["auroravisuals.mixins.json"],"depends":{"fabricloader":">=0.18.4","minecraft":"~26.1","java":">=25"}}\n' > src/main/resources/fabric.mod.json
          printf '{"required":true,"minVersion":"0.8","package":"dev.aurora.mixin","compatibilityLevel":"JAVA_25","client":["GuiMixin"],"injectors":{"defaultRequire":1}}\n' > src/main/resources/auroravisuals.mixins.json
          cat << 'EOF' > src/main/java/dev/aurora/mixin/GuiMixin.java
          package dev.aurora.mixin;
          import dev.aurora.AuroraHudRenderer;
          import net.minecraft.client.DeltaTracker;
          import net.minecraft.client.gui.Gui;
          import net.minecraft.client.gui.GuiGraphicsExtractor;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;
          @Mixin(Gui.class)
          public class GuiMixin {
              @Inject(method = "extractRenderState", at = @At("TAIL"))
              private void onRender(GuiGraphicsExtractor g, DeltaTracker d, CallbackInfo ci) {
                  AuroraHudRenderer.renderHud(g, d);
              }
          }
          EOF
          cat << 'EOF' > src/main/java/dev/aurora/AuroraConfig.java
          package dev.aurora;
          import java.awt.Color;
          public class AuroraConfig {
              public static boolean watermark = true, statsPills = true, targetHud = true, customCrosshair = true;
              public static boolean hitParticles = true, keystrokes = true, ambientFireflies = true;
              public static boolean shockwaveAndCombo = true, potionHud = true, screenVignette = true;
              public static int themeIndex = 0;
              public static final String[] THEME_NAMES = {"Cyberpunk", "Chroma RGB", "Sakura", "Ocean", "Blood Moon", "Sunset Gold"};
              private static final int[][] COLORS = {{0xFF00F5D4,0xFFB5179E},{0xFFFF0055,0xFF00FFAA},{0xFFFF758F,0xFF72EFDD},{0xFF00BBF9,0xFF00F5D4},{0xFFFF0A54,0xFFFF9E00},{0xFFFFBE0B,0xFF8338EC}};
              public static int getPrimaryColor() { return themeIndex == 1 ? getAnimatedColor(0) : COLORS[themeIndex][0]; }
              public static int getSecondaryColor() { return themeIndex == 1 ? getAnimatedColor(800) : COLORS[themeIndex][1]; }
              public static void nextTheme() { themeIndex = (themeIndex + 1) % THEME_NAMES.length; }
              public static int getAnimatedColor(int offset) {
                  if (themeIndex == 1) return Color.HSBtoRGB(((System.currentTimeMillis() + offset) % 3600L) / 3600f, 0.85f, 1f) | 0xFF000000;
                  float t = (float)((Math.sin((System.currentTimeMillis() + offset) * 0.0035) + 1.0) * 0.5);
                  int c1 = COLORS[themeIndex][0], c2 = COLORS[themeIndex][1];
                  int r = (int)(((c1>>16)&255) + (((c2>>16)&255) - ((c1>>16)&255)) * t);
                  int g = (int)(((c1>>8)&255) + (((c2>>8)&255) - ((c1>>8)&255)) * t);
                  int b = (int)((c1&255) + ((c2&255) - (c1&255)) * t);
                  return 0xFF000000 | (r << 16) | (g << 8) | b;
              }
              public static int withAlpha(int c, int a) { return (c & 0x00FFFFFF) | (Math.max(0, Math.min(255, a)) << 24); }
          }
          EOF
          cat << 'EOF' > src/main/java/dev/aurora/AuroraHudRenderer.java
          package dev.aurora;
          import net.minecraft.client.DeltaTracker;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.Font;
          import net.minecraft.client.gui.GuiGraphicsExtractor;
          import net.minecraft.world.effect.MobEffectInstance;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.item.Items;
          import net.minecraft.world.phys.EntityHitResult;
          import org.lwjgl.glfw.GLFW;
          import java.util.*;
          public class AuroraHudRenderer {
              private static LivingEntity target = null;
              private static long targetTime = 0L, lastHitTime = 0L;
              private static float animHp = 20f, lastHp = -1f, wave = 1f, flash = 0f;
              private static int combo = 0;
              private static boolean zeroHeld = false;
              private static final List<float[]> SPARKS = new ArrayList<>(), FLIES = new ArrayList<>();
              private static final Random R = new Random();
              public static void renderHud(GuiGraphicsExtractor g, DeltaTracker d) {
                  Minecraft mc = Minecraft.getInstance();
                  if (mc.player == null) return;
                  long win = GLFW.glfwGetCurrentContext();
                  if (win != 0L) {
                      boolean down = GLFW.glfwGetKey(win, GLFW.GLFW_KEY_0) == GLFW.GLFW_PRESS || GLFW.glfwGetKey(win, GLFW.GLFW_KEY_KP_0) == GLFW.GLFW_PRESS;
                      if (down && !zeroHeld) {
                          if (mc.screen instanceof AuroraMenuScreen) mc.setScreen(null);
                          else if (mc.screen == null) mc.setScreen(new AuroraMenuScreen());
                      }
                      zeroHeld = down;
                  }
                  if (mc.hitResult instanceof EntityHitResult ehr && ehr.getEntity() instanceof LivingEntity liv) {
                      if (target != liv) { target = liv; lastHp = liv.getHealth(); }
                      targetTime = System.currentTimeMillis();
                  }
                  int sw = mc.getWindow().getGuiScaledWidth(), sh = mc.getWindow().getGuiScaledHeight();
                  if (target != null) {
                      float hp = target.getHealth();
                      if (lastHp > hp && lastHp - hp >= 0.1f) {
                          long now = System.currentTimeMillis();
                          combo = (now - lastHitTime < 2500L) ? combo + 1 : 1;
                          lastHitTime = now; wave = 0f; flash = 0.35f;
                          for (int i = 0; i < 14; i++) {
                              double a = R.nextDouble() * 6.28; float s = 1.4f + R.nextFloat() * 3f;
                              SPARKS.add(new float[]{sw/2f, sh/2f, (float)Math.cos(a)*s, (float)Math.sin(a)*s, 1f});
                          }
                      }
                      lastHp = hp;
                      if (!target.isAlive() || System.currentTimeMillis() - targetTime > 3000L) target = null;
                  }
                  if (mc.options.hideGui) return;
                  Font f = mc.font;
                  if (AuroraConfig.ambientFireflies) {
                      while (FLIES.size() < 16) FLIES.add(new float[]{R.nextInt(Math.max(100,sw)), R.nextInt(Math.max(100,sh)), (R.nextFloat()-0.5f)*0.4f, (R.nextFloat()-0.5f)*0.3f, R.nextFloat()*6f});
                      for (float[] p : FLIES) {
                          p[0] = (p[0] + p[2] + sw) % sw; p[1] = (p[1] + p[3] + sh) % sh; p[4] += 0.05f;
                          int a = (int)((Math.sin(p[4])+1)*60)+25, c = AuroraConfig.getAnimatedColor((int)(p[0]*10));
                          g.fill((int)p[0]-2,(int)p[1]-2,(int)p[0]+2,(int)p[1]+2, AuroraConfig.withAlpha(c, a/3));
                          g.fill((int)p[0]-1,(int)p[1]-1,(int)p[0]+1,(int)p[1]+1, AuroraConfig.withAlpha(c, a));
                      }
                  }
                  if (AuroraConfig.screenVignette && (mc.player.getHealth() <= 7f || flash > 0.01f)) {
                      int a = mc.player.getHealth() <= 7f ? (int)(45 + Math.sin(System.currentTimeMillis()*0.01)*40) : (int)(flash*180);
                      int c = AuroraConfig.withAlpha(mc.player.getHealth() <= 7f ? 0xFFFF0A54 : AuroraConfig.getPrimaryColor(), a);
                      flash *= 0.88f;
                      g.fill(0,0,sw,3,c); g.fill(0,sh-3,sw,sh,c); g.fill(0,3,3,sh-3,c); g.fill(sw-3,3,sw,sh-3,c);
                  }
                  if (AuroraConfig.watermark) {
                      String wm = "AURORA 26.1 ULTIMATE | " + mc.getFps() + " FPS | [0] MENU";
                      drawNeonPanel(g, 8, 8, f.width(wm)+14, 18);
                      g.text(f, wm, 15, 13, 0xFFFFFFFF, true);
                  }
                  if (AuroraConfig.statsPills) {
                      int tot = mc.player.getOffhandItem().is(Items.TOTEM_OF_UNDYING) ? mc.player.getOffhandItem().getCount() : 0;
                      for (int i=0; i<mc.player.getInventory().getContainerSize(); i++) if (mc.player.getInventory().getItem(i).is(Items.TOTEM_OF_UNDYING)) tot += mc.player.getInventory().getItem(i).getCount();
                      double bps = Math.hypot(mc.player.getX()-mc.player.xo, mc.player.getZ()-mc.player.zo)*20.0;
                      String s1 = "Тотемы: " + tot + " | Броня: " + mc.player.getArmorValue() + " | Комбо: x" + combo;
                      String s2 = String.format(Locale.ROOT, "XYZ: %.0f, %.0f, %.0f | %.1f б/с", mc.player.getX(), mc.player.getY(), mc.player.getZ(), bps);
                      drawNeonPanel(g, 8, sh-44, f.width(s1)+12, 16); g.text(f, s1, 14, sh-40, tot>0?0xFFFFBE0B:0xFFFFFFFF, true);
                      drawNeonPanel(g, 8, sh-24, f.width(s2)+12, 16); g.text(f, s2, 14, sh-20, AuroraConfig.getAnimatedColor(300), true);
                  }
                  if (AuroraConfig.keystrokes) {
                      key(g,f,"W",30,32,20,20,mc.options.keyUp.isDown()); key(g,f,"A",8,54,20,20,mc.options.keyLeft.isDown());
                      key(g,f,"S",30,54,20,20,mc.options.keyDown.isDown()); key(g,f,"D",52,54,20,20,mc.options.keyRight.isDown());
                      key(g,f,"JUMP",8,76,64,14,mc.options.keyJump.isDown());
                  }
                  if (AuroraConfig.potionHud) {
                      int py = 8;
                      for (MobEffectInstance ef : mc.player.getActiveEffects()) {
                          int sec = Math.max(0, ef.getDuration()/20);
                          String lb = ef.getEffect().value().getDisplayName().getString() + " " + (ef.getAmplifier()+1) + String.format(Locale.ROOT," (%d:%02d)",sec/60,sec%60);
                          int pw = f.width(lb)+12; drawNeonPanel(g, sw-pw-8, py, pw, 16); g.text(f, lb, sw-pw-2, py+4, 0xFFFFFFFF, true); py += 20;
                      }
                  }
                  if (AuroraConfig.targetHud && target != null) {
                      float hp = target.getHealth(), max = Math.max(1f, target.getMaxHealth());
                      animHp += (hp - animHp) * 0.18f;
                      int x = sw/2+18, y = sh/2+12, w = 142, h = 44;
                      drawNeonPanel(g, x, y, w, h);
                      String nm = target.getName().getString(); if (nm.length()>15) nm = nm.substring(0,15);
                      g.text(f, nm, x+8, y+6, 0xFFFFFFFF, true);
                      g.text(f, String.format(Locale.ROOT, "%.1f HP | %.1fm", hp, mc.player.distanceTo(target)), x+8, y+17, 0xFFB8C0FF, true);
                      g.fill(x+8, y+31, x+w-8, y+37, 0xAA090A10);
                      g.fillGradient(x+8, y+31, x+8+(int)((w-16)*Math.max(0f,Math.min(1f,animHp/max))), y+37, AuroraConfig.getPrimaryColor(), AuroraConfig.getSecondaryColor());
                  }
                  if (AuroraConfig.shockwaveAndCombo && wave < 1f) {
                      wave += 0.06f; int r = (int)(4 + wave*26), c = AuroraConfig.withAlpha(AuroraConfig.getAnimatedColor(0), (int)((1f-wave)*190));
                      int cx = sw/2, cy = sh/2;
                      g.fill(cx-r,cy-r,cx+r,cy-r+1,c); g.fill(cx-r,cy+r-1,cx+r,cy+r,c); g.fill(cx-r,cy-r,cx-r+1,cy+r,c); g.fill(cx+r-1,cy-r,cx+r,cy+r,c);
                  }
                  if (AuroraConfig.customCrosshair) {
                      float cd = mc.player.getAttackStrengthScale(0f); int gap = (int)(3+(1f-cd)*5), cx = sw/2, cy = sh/2, c = AuroraConfig.getAnimatedColor(0);
                      g.fill(cx-1,cy-gap-4,cx+1,cy-gap,c); g.fill(cx-1,cy+gap,cx+1,cy+gap+4,c); g.fill(cx-gap-4,cy-1,cx-gap,cy+1,c); g.fill(cx+gap,cy-1,cx+gap+4,cy+1,c);
                  }
                  if (AuroraConfig.hitParticles) {
                      Iterator<float[]> it = SPARKS.iterator();
                      while (it.hasNext()) {
                          float[] s = it.next(); s[0]+=s[2]; s[1]+=s[3]; s[3]+=0.06f; s[4]-=0.04f;
                          if (s[4]<=0f) { it.remove(); continue; }
                          g.fill((int)s[0]-2,(int)s[1]-2,(int)s[0]+2,(int)s[1]+2, AuroraConfig.withAlpha(AuroraConfig.getPrimaryColor(), (int)(s[4]*240)));
                      }
                  }
              }
              private static void key(GuiGraphicsExtractor g, Font f, String s, int x, int y, int w, int h, boolean d) {
                  int c = AuroraConfig.getAnimatedColor(x*15);
                  g.fill(x,y,x+w,y+h, d ? AuroraConfig.withAlpha(c,165) : 0x8810121A); g.fill(x,y,x+w,y+1,c);
                  g.text(f, s, x+(w-f.width(s))/2, y+(h-8)/2, d ? 0xFF10121A : 0xFFFFFFFF, !d);
              }
              public static void drawNeonPanel(GuiGraphicsExtractor g, int x, int y, int w, int h) {
                  int c1 = AuroraConfig.getAnimatedColor(0), c2 = AuroraConfig.getAnimatedColor(600);
                  g.fill(x-2,y-2,x+w+2,y+h+2,AuroraConfig.withAlpha(c1,28)); g.fill(x-1,y-1,x+w+1,y+h+1,AuroraConfig.withAlpha(c2,55));
                  g.fill(x,y,x+w,y+h,0xCC0D0F18); g.fillGradient(x,y,x+w,y+2,c1,c2);
              }
          }
          EOF
          cat << 'EOF' > src/main/java/dev/aurora/AuroraMenuScreen.java
          package dev.aurora;
          import net.minecraft.client.gui.GuiGraphicsExtractor;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.network.chat.Component;
          public class AuroraMenuScreen extends Screen {
              public AuroraMenuScreen() { super(Component.literal("Aurora 26.1")); }
              @Override
              protected void init() {
                  int w = 248, sx = (this.width - w) / 2, sy = (this.height - 216) / 2 + 26, bw = 118, bh = 20;
                  this.addRenderableWidget(Button.builder(Component.literal("Тема: " + AuroraConfig.THEME_NAMES[AuroraConfig.themeIndex]), b -> { AuroraConfig.nextTheme(); b.setMessage(Component.literal("Тема: " + AuroraConfig.THEME_NAMES[AuroraConfig.themeIndex])); }).bounds(sx, sy, w, bh).build());
                  this.addRenderableWidget(Button.builder(t("Watermark", AuroraConfig.watermark), b -> { AuroraConfig.watermark=!AuroraConfig.watermark; b.setMessage(t("Watermark", AuroraConfig.watermark)); }).bounds(sx, sy+24, bw, bh).build());
                  this.addRenderableWidget(Button.builder(t("TargetHUD", AuroraConfig.targetHud), b -> { AuroraConfig.targetHud=!AuroraConfig.targetHud; b.setMessage(t("TargetHUD", AuroraConfig.targetHud)); }).bounds(sx, sy+48, bw, bh).build());
                  this.addRenderableWidget(Button.builder(t("Keystrokes", AuroraConfig.keystrokes), b -> { AuroraConfig.keystrokes=!AuroraConfig.keystrokes; b.setMessage(t("Keystrokes", AuroraConfig.keystrokes)); }).bounds(sx, sy+72, bw, bh).build());
                  this.addRenderableWidget(Button.builder(t("Светлячки", AuroraConfig.ambientFireflies), b -> { AuroraConfig.ambientFireflies=!AuroraConfig.ambientFireflies; b.setMessage(t("Светлячки", AuroraConfig.ambientFireflies)); }).bounds(sx, sy+96, bw, bh).build());
                  this.addRenderableWidget(Button.builder(t("Зелья", AuroraConfig.potionHud), b -> { AuroraConfig.potionHud=!AuroraConfig.potionHud; b.setMessage(t("Зелья", AuroraConfig.potionHud)); }).bounds(sx, sy+120, bw, bh).build());
                  this.addRenderableWidget(Button.builder(t("Тотемы/Инфо", AuroraConfig.statsPills), b -> { AuroraConfig.statsPills=!AuroraConfig.statsPills; b.setMessage(t("Тотемы/Инфо", AuroraConfig.statsPills)); }).bounds(sx+130, sy+24, bw, bh).build());
                  this.addRenderableWidget(Button.builder(t("Прицел", AuroraConfig.customCrosshair), b -> { AuroraConfig.customCrosshair=!AuroraConfig.customCrosshair; b.setMessage(t("Прицел", AuroraConfig.customCrosshair)); }).bounds(sx+130, sy+48, bw, bh).build());
                  this.addRenderableWidget(Button.builder(t("Искры", AuroraConfig.hitParticles), b -> { AuroraConfig.hitParticles=!AuroraConfig.hitParticles; b.setMessage(t("Искры", AuroraConfig.hitParticles)); }).bounds(sx+130, sy+72, bw, bh).build());
                  this.addRenderableWidget(Button.builder(t("Волна удара", AuroraConfig.shockwaveAndCombo), b -> { AuroraConfig.shockwaveAndCombo=!AuroraConfig.shockwaveAndCombo; b.setMessage(t("Волна удара", AuroraConfig.shockwaveAndCombo)); }).bounds(sx+130, sy+96, bw, bh).build());
                  this.addRenderableWidget(Button.builder(t("Виньетка", AuroraConfig.screenVignette), b -> { AuroraConfig.screenVignette=!AuroraConfig.screenVignette; b.setMessage(t("Виньетка", AuroraConfig.screenVignette)); }).bounds(sx+130, sy+120, bw, bh).build());
                  this.addRenderableWidget(Button.builder(Component.literal("Закрыть меню [0 / ESC]"), b -> this.onClose()).bounds(sx, sy+148, w, bh).build());
              }
              private Component t(String n, boolean s) { return Component.literal(n + ": " + (s ? "§aВКЛ" : "§cВЫКЛ")); }
              @Override
              public void extractRenderState(GuiGraphicsExtractor g, int mx, int my, float d) {
                  g.fill(0, 0, this.width, this.height, 0x8806070B);
                  int cw = 272, ch = 208, cx = (this.width - cw) / 2, cy = (this.height - ch) / 2;
                  AuroraHudRenderer.drawNeonPanel(g, cx, cy, cw, ch);
                  String title = "✦ AURORA 26.1 ULTIMATE (PC & POJAV) ✦";
                  g.text(this.font, title, (this.width - this.font.width(title)) / 2, cy + 9, AuroraConfig.getAnimatedColor(0), true);
                  super.extractRenderState(g, mx, my, d);
              }
              @Override
              public boolean isPauseScreen() { return false; }
          }
          EOF
          gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-Visuals-26.1-Mod
          path: mod/build/libs/*.jar
          
