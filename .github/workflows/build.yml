              private static void renderStatsPills(GuiGraphicsExtractor g, Font font, Minecraft mc, int sh) {
                  double bps = Math.hypot(mc.player.getX() - mc.player.xo, mc.player.getZ() - mc.player.zo) * 20.0;
                  int totems = countTotems(mc);
                  String combatStr = "Тотемы: " + totems + "  |  Броня: " + mc.player.getArmorValue() + "  |  Комбо: x" + comboCount;
                  String posStr = String.format(Locale.ROOT, "XYZ: %.0f, %.0f, %.0f  |  %.1f б/с", mc.player.getX(), mc.player.getY(), mc.player.getZ(), bps);
                  drawNeonPanel(g, 8, sh - 44, font.width(combatStr) + 12, 16);
                  g.text(font, combatStr, 14, sh - 40, totems > 0 ? 0xFFFFBE0B : 0xFFE0FBFC, true);
                  drawNeonPanel(g, 8, sh - 24, font.width(posStr) + 12, 16);
